name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify vendored BouncyCastle jar pins
        # Pinned in lib/README.md — the vendored BC 1.85 beta jars must be the
        # exact bytes the BLS byte-identity contract was validated against.
        run: |
          sha256sum -c <<'EOF'
          03b4a7656d6aedcff28626e26c1645f4b9956bf0c6d614ee0fba3241a2ced5b8  lib/bcprov-jdk18on-1.85-SNAPSHOT.jar
          8ec6507c99806587ec739f1e1c710226326f81aecfd8dccad4f6c5753a3e5349  lib/bcpkix-jdk18on-1.85-SNAPSHOT.jar
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x99E82A75642AC823" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Cache sbt / Coursier / Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Compile and test
        run: sbt test doc
