name: CI
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three cold-cache builds per push: the compile/doc macro race only
        # surfaces on fresh runners, so one green job is not a strong signal.
        attempt: [1, 2, 3]
    steps:
      - name: Checkout Metakit repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x99E82A75642AC823" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Build, doc, and package (same task shape as ci-release)
        run: sbt clean publishLocal
